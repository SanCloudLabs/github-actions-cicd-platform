name: CI Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  docker-build:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build Docker Image

        run: |
          docker build \
            -t github-actions-cicd-platform:1.0 \
            -f docker/Dockerfile \
            .